name: ci

on:
  push:
    branches: [main, dev, integration, "integration-*"]
  pull_request:
    branches: [main, dev, integration, "integration-*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: Run verification gates
        run: ./scripts/verify.sh

  coverage:
    # Coverage is VISUALIZATION, not a merge gate (matches fkst-packages doctrine).
    # cargo-llvm-cov produces LCOV from an instrumented test run; the Codecov upload is an
    # EXTERNAL service and must NOT gate green CI (fail_ci_if_error: false). Do NOT add this
    # job to branch-protection required checks. Repo is PUBLIC: tokenless upload may work;
    # CODECOV_TOKEN is an OPTIONAL operator secret; PR comments/status need the Codecov GitHub App.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust + llvm-tools
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable
          rustc --version
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate LCOV coverage
        # Unit-test coverage only (--lib --bins): the integration tests (tests/) spawn and
        # SIGKILL fkst-framework subprocesses (supervise/spawn lifecycle); under llvm-cov the
        # killed instrumented children write partial .profraw files that corrupt the profile
        # merge (a known cargo-llvm-cov limitation with spawn-and-kill subprocesses). Unit
        # tests in src/ don't spawn-and-kill instrumented binaries, so they cover cleanly.
        # --test-threads=1 keeps it deterministic. Coverage is non-gating VISUALIZATION; the
        # hermetic verify job remains the enforcement authority and runs the full suite.
        run: cargo llvm-cov --lib --bins --workspace --lcov --output-path lcov.info -- --test-threads=1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./lcov.info
          disable_search: true
          flags: rust
          name: rust-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
