[workspace]
resolver = "2"
members = [
    "crates/fkst-common",
    "crates/fkst-supervisor",
    "crates/fkst-framework",
    "crates/fkst-update",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
authors = ["auric"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.27", features = ["fs", "signal", "process"] }
base64 = "0.22"
ulid = "1"
mlua = { version = "0.10", features = ["lua54", "vendored", "send", "serialize"] }
