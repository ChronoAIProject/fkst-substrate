# Codecov configuration for fkst-substrate (Rust engine).
#
# Coverage on Codecov is VISUALIZATION, not a merge gate. The hermetic `verify`
# job (scripts/verify.sh) remains the enforcement authority; merge authority is
# PR-diff review consensus -- never an external service. The statuses below are
# informational so Codecov never blocks a merge, consistent with the CI upload
# step's fail_ci_if_error: false.

coverage:
  precision: 2
  round: down
  range: "50...100"
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

flags:
  rust:
    paths:
      - crates/
    carryforward: true

ignore:
  - "**/tests/**"
  - "**/target/**"
  - "**/build.rs"
